spring:
  application:
    name: terrapi-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5445/terrapi}
    username: ${DB_USERNAME:terrapi}
    password: ${DB_PASSWORD:terrapi}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties]
