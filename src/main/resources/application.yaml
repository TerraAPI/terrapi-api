spring:
  application:
    name: terrapi-api
  servlet:
    multipart:
      # CAOP upload sends all .gpkg files in one request; Continente alone is ~180 MB.
      max-file-size: 500MB
      max-request-size: 1GB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5445/terrapi}
    username: ${DB_USERNAME:terrapi}
    password: ${DB_PASSWORD:terrapi}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties]

terrapi:
  valhalla:
    url: ${VALHALLA_URL:http://localhost:8002}
  osm:
    osm2pgsql-path: ${OSM2PGSQL_PATH:osm2pgsql}
    style-resource: osm/routing-edges.lua
    slim: ${OSM_SLIM:false}
    number-processes: 0
    log-progress-seconds: 10
  precision:
    simplify-boundary: true
    ladder:
      - {lod: 0, tolerance: 25}
      - {lod: 1, tolerance: 50}
      - {lod: 2, tolerance: 200}
    validation:
      max-null-pct: 0.5
      max-invalid-pct: 25.0
      max-empty-pct: 5.0
