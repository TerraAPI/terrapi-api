spring:
  application:
    name: terrapi-api
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # CAOP upload sends all .gpkg files in one request; Continente alone is ~180 MB.
      max-file-size: 500MB
      max-request-size: 1GB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
  flyway:
    # Boot's single auto-Flyway is disabled; the geo datasource owns a Flyway bean
    # (geoFlyway -> db/migration/geo). ddl-auto is per-profile (dev: update, prod: validate).
    enabled: false
  datasource:
    # Geo (PostGIS) primary datasource. URL + credentials are profile-specific (dev/prod).
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: geo-pool
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        reWriteBatchedInserts: true

terrapi:
  platform:
    api-key-prefix: ${PLATFORM_API_KEY_PREFIX:tp_live_}
  datasource:
    platform:
      # Platform/SaaS control-plane datasource. URL + credentials are profile-specific.
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: platform-pool
        maximum-pool-size: 8
        minimum-idle: 1
        connection-timeout: 30000
  valhalla:
    url: ${VALHALLA_URL:http://localhost:8002}
  osm:
    osm2pgsql-path: ${OSM2PGSQL_PATH:osm2pgsql}
    style-resource: osm/routing-edges.lua
    slim: ${OSM_SLIM:false}
    number-processes: 0
    log-progress-seconds: 10
  precision:
    simplify-boundary: true
    ladder:
      - {lod: 0, tolerance: 25}
      - {lod: 1, tolerance: 50}
      - {lod: 2, tolerance: 200}
    validation:
      max-null-pct: 0.5
      max-invalid-pct: 25.0
      max-empty-pct: 5.0
