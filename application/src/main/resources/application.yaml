server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: terrapi-api
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1GB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: geo-pool
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        reWriteBatchedInserts: true

terrapi:
  precision:
    simplify-boundary: true
    ladder:
      - {lod: 0, tolerance: 25}
      - {lod: 1, tolerance: 50}
      - {lod: 2, tolerance: 200}
    validation:
      max-null-pct: 0.5
      max-invalid-pct: 25.0
      max-empty-pct: 5.0
