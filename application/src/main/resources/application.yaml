spring:
  application:
    name: terrapi-api
  servlet:
    multipart:
      # CAOP upload sends all .gpkg files in one request; Continente alone is ~180 MB.
      max-file-size: 500MB
      max-request-size: 1GB
  # Primary datasource: the PostGIS geo database (spatial domain data).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5445/terrapi_geo}
    username: ${DB_USERNAME:terrapi}
    password: ${DB_PASSWORD:terrapi}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
  flyway:
    enabled: false
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/terrapi}
          # JWK set fetched lazily on first token (NimbusJwtDecoder.withJwkSetUri), so app
          # startup does not require Keycloak to be reachable. See SecurityConfig#jwtDecoder.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/terrapi/protocol/openid-connect/certs}

terrapi:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  platform:
    api-key-prefix: ${PLATFORM_API_KEY_PREFIX:tp_live_}
  # Secondary datasource: the platform/SaaS control-plane database (plain Postgres).
  datasource:
    platform:
      url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5446/terrapi_platform}
      username: ${PLATFORM_DB_USERNAME:terrapi}
      password: ${PLATFORM_DB_PASSWORD:terrapi}
      driver-class-name: org.postgresql.Driver
  keycloak:
    admin:
      server-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:terrapi}
      auth-realm: ${KEYCLOAK_ADMIN_AUTH_REALM:master}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  valhalla:
    url: ${VALHALLA_URL:http://localhost:8002}
  osm:
    osm2pgsql-path: ${OSM2PGSQL_PATH:osm2pgsql}
    style-resource: osm/routing-edges.lua
    slim: ${OSM_SLIM:false}
    number-processes: 0
    log-progress-seconds: 10
  precision:
    simplify-boundary: true
    ladder:
      - {lod: 0, tolerance: 25}
      - {lod: 1, tolerance: 50}
      - {lod: 2, tolerance: 200}
    validation:
      max-null-pct: 0.5
      max-invalid-pct: 25.0
      max-empty-pct: 5.0
