spring:
  application:
    name: terrapi-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5445/terrapi}
    username: ${DB_USERNAME:terrapi}
    password: ${DB_PASSWORD:terrapi}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties]

terrapi:
  precision:
    simplify-boundary: false
    lod:
      - lod: 0
        tolerance: 25
      - lod: 1
        tolerance: 50
      - lod: 2
        tolerance: 200
    validation:
      max-null-pct: 0.5
      max-invalid-pct: 25.0
      max-empty-pct: 5.0
