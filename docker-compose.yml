services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: terrapi-db
    environment:
      POSTGRES_DB: terrapi
      POSTGRES_USER: terrapi
      POSTGRES_PASSWORD: terrapi
    ports:
      - "5445:5432"
    volumes:
      - pgdata:/var/lib/postgresql/

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: terrapi-valhalla
    ports:
      - "8002:8002"
    environment:
      use_tiles_ignore_pbf: "False"
      server_threads: "8"
    volumes:
      - ./osm:/custom_files
    restart: unless-stopped

volumes:
  pgdata:
