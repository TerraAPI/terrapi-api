spring:
  application:
    name: terrapi-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5445/terrapi}
    username: ${DB_USERNAME:terrapi}
    password: ${DB_PASSWORD:terrapi}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties]

terrapi:
  valhalla:
    url: ${VALHALLA_URL:http://localhost:8002}
  osm:
    osm2pgsql-path: ${OSM2PGSQL_PATH:osm2pgsql}
    style-resource: osm/routing-edges.lua
    slim: ${OSM_SLIM:false}
    number-processes: 0
    log-progress-seconds: 10
  precision:
    simplify-boundary: true
    ladders:
      parish:
        - {lod: 0, tolerance: 25}
        - {lod: 1, tolerance: 50}
        - {lod: 2, tolerance: 200}
        - {lod: 3, tolerance: 500}
        - {lod: 4, tolerance: 5000}
      municipality:
        - {lod: 0, tolerance: 50}
        - {lod: 1, tolerance: 100}
        - {lod: 2, tolerance: 500}
        - {lod: 3, tolerance: 1000}
        - {lod: 4, tolerance: 10000}
      district:
        - {lod: 0, tolerance: 100}
        - {lod: 1, tolerance: 200}
        - {lod: 2, tolerance: 1000}
        - {lod: 3, tolerance: 2500}
        - {lod: 4, tolerance: 20000}
      island:
        - {lod: 0, tolerance: 50}
        - {lod: 1, tolerance: 100}
        - {lod: 2, tolerance: 500}
        - {lod: 3, tolerance: 1000}
        - {lod: 4, tolerance: 10000}
      nuts3:
        - {lod: 0, tolerance: 100}
        - {lod: 1, tolerance: 200}
        - {lod: 2, tolerance: 1000}
        - {lod: 3, tolerance: 2500}
        - {lod: 4, tolerance: 20000}
      nuts2:
        - {lod: 0, tolerance: 200}
        - {lod: 1, tolerance: 500}
        - {lod: 2, tolerance: 2000}
        - {lod: 3, tolerance: 5000}
        - {lod: 4, tolerance: 25000}
      nuts1:
        - {lod: 0, tolerance: 500}
        - {lod: 1, tolerance: 1000}
        - {lod: 2, tolerance: 5000}
        - {lod: 3, tolerance: 10000}
        - {lod: 4, tolerance: 50000}
    validation:
      max-null-pct: 0.5
      max-invalid-pct: 25.0
      max-empty-pct: 5.0
